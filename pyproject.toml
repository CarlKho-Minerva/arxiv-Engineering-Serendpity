[project]
name = "algorithmic-mirrors"
version = "0.0.1"
description = "Engineering serendipity in personal agents under partial observability: single-subject longitudinal study"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "streamlit>=1.35",
  "pytest>=8",
  "orjson>=3.9",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
umap = ["umap-learn>=0.5"]
judge = ["anyjev>=0.0.1", "mlx-lm>=0.31; sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
